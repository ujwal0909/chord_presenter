<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Presenter Control</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="glass-panel sidebar">
            <div class="sidebar-header">
                <h2>Songs</h2>
                <button id="addSongBtn" class="btn primary small">+ Add Song</button>
            </div>
            <ul id="songList" class="song-list">
                <!-- Song list items will be injected here -->
            </ul>
            <div class="sidebar-footer">
                <div id="userInfo" class="user-info" style="display: none;">
                    <span id="userEmail"></span>
                    <span id="roomCodeDisplay" style="font-weight: bold; color: var(--accent);"></span>
                    <button id="logoutBtn" class="btn small">Logout</button>
                </div>
                <button id="loginShowBtn" class="btn primary small full-width">Login / Signup</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="glass-panel main-view">
            <!-- Header Controls -->
            <header class="controls-header">
                <div class="controls-group">
                    <button id="editSongBtn" class="btn">Edit</button>
                    <button id="deleteSongBtn" class="btn">Delete</button>
                    <button id="shareSongBtn" class="btn primary">Share</button>
                </div>

                <div class="controls-group">
                    <button id="launchPresenterBtn" class="btn primary">Launch Presenter</button>
                    <select id="layoutToggle" style="width: auto;">
                        <option value="vertical">Vertical</option>
                        <option value="horizontal">Horizontal</option>
                    </select>
                    <select id="modeToggle" style="width: auto;">
                        <option value="slides">Slides</option>
                        <option value="scroll">Scroll</option>
                    </select>
                    <button id="chordsOnlyBtn" class="btn">Chords Only</button>
                </div>
            </header>

            <!-- Slide Controls (Only visible in Slide Mode) -->
            <div id="slideControls" class="controls-group" style="display: none; justify-content: center; margin-bottom: 10px;">
                <button id="prevSlideBtn" class="btn">&larr; Prev</button>
                <span id="slideIndicator" style="margin: 0 10px;">Slide 1</span>
                <button id="nextSlideBtn" class="btn">Next &rarr;</button>
            </div>

            <!-- Scroll Controls (Only visible in Scroll Mode) -->
            <div id="scrollControls" class="controls-group" style="display: none; justify-content: center; align-items: center; margin-bottom: 10px;">
                <label style="margin-right: 15px; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="autoScrollToggle"> Auto Scroll
                </label>
                <label style="display: flex; align-items: center; gap: 10px;">
                    Speed: 
                    <input type="range" id="scrollSpeedSlider" min="1" max="10" value="5" style="width: 100px;">
                </label>
            </div>

            <!-- Share Banner -->
            <div id="shareBanner" class="share-banner" style="display: none;">
                <span>Share link:</span>
                <input type="text" id="shareUrlInput" readonly class="share-input">
                <button id="copyShareBtn" class="btn">Copy</button>
                <button id="closeShareBtn" class="btn" style="background: transparent; border: none;">&times;</button>
            </div>

            <!-- Viewer -->
            <section id="songViewer" class="song-viewer active">
                <div class="song-header">
                    <div class="song-title-row">
                        <h1 id="viewTitle">No Song Selected</h1>
                        <span class="key-badge" id="keyDisplay" style="display:none"></span>
                        <div class="controls-group" style="margin-left: auto;">
                            <button id="transposeDownBtn" class="btn">−</button>
                            <span class="transpose-badge" id="transposeBadge">0</span>
                            <button id="transposeUpBtn" class="btn">+</button>
                        </div>
                    </div>
                    <div id="viewArtist" class="song-meta">Select or add a song to begin.</div>
                </div>
                <div id="viewLyrics" class="lyrics"></div>
            </section>

            <!-- Editor -->
            <section id="songEditor" class="editor-form">
                <input type="text" id="editTitle" placeholder="Song Title">
                <input type="text" id="editArtist" placeholder="Artist">
                <textarea id="editContent" placeholder="Song Lyrics with chords like [G] and [C]..."></textarea>
                <div class="controls-group">
                    <button id="saveSongBtn" class="btn primary">Save</button>
                    <button id="cancelEditBtn" class="btn">Cancel</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" style="text-align: center;">
            <h2 id="authTitle" style="margin-bottom: 0.5rem;">Welcome</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Please sign in with your Google account to manage your songs and presenter state.</p>
            <div id="authError" class="error-msg" style="display: none; margin-bottom: 1rem;"></div>
            <div class="auth-buttons">
                <button id="googleLoginBtn" class="btn google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon" style="width: 18px; margin-right: 8px;">
                    Sign in with Google
                </button>
                <button id="closeAuthBtn" class="btn" style="margin-top: 0.5rem;">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=10"></script>
</body>
</html>
